[project]
name = "mero"
version = "0.1.0"
description = "MeRO – Universal low-step residual corrector"
requires-python = ">=3.10"
authors = [{ name = "Research Team", email = "research@example.com" }]

# ---------------------------------------------------------------------------
#  Runtime dependencies.  All entries must follow valid PEP-508 syntax.
# ---------------------------------------------------------------------------

dependencies = [
    "torch>=2.2",
    "diffusers>=0.27",
    "xformers>=0.0.24",
    "timm>=0.9.12",
    "clean-fid>=0.1.35",
    "wandb",
    "mlflow",
    "tensorboard",
    "pyyaml",
    "tqdm",
    "requests",
    "matplotlib",
    "seaborn",
    "opencv-python",
    "Pillow",
    "transformers>=4.37",
    # Optional – OpenAI CLIP for perceptual metrics / text encoders.
    # NOTE: PEP-508 requires the form "name @ URL" for direct-URL installs.
    "clip @ git+https://github.com/openai/CLIP.git",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
